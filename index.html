<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotePadWeb--</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='1' width='12' height='14' rx='1' fill='%23fff' stroke='%232b78c5'/%3E%3Cpath d='M4 5h8M4 8h8M4 11h5' stroke='%232b78c5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="classic">
  <div id="app">
    <div id="menubar"></div>
    <div id="toolbar"></div>
    <div id="banner" class="hidden"></div>
    <div id="main">
      <aside id="side">
        <div class="side-tabs">
          <button type="button" data-tab="tree" class="on">文件夹</button>
          <button type="button" data-tab="docs">文档</button>
          <button type="button" data-tab="funcs">函数</button>
        </div>
        <div class="side-filter"><input id="treeFilter" placeholder="筛选名称"></div>
        <div id="sideBody"></div>
      </aside>
      <div id="sideResizer"></div>
      <section id="center">
        <div id="tabs"></div>
        <div id="fileWarn" class="hidden"></div>
        <div id="stack">
          <div id="editorHost"></div>
          <div id="hint">
            <div class="hint-card">
              <h1>NotePadWeb--</h1>
              <p>直接在这里写字。打开文件夹后可以浏览、编辑并保存，也可以同时打开多个文件夹。</p>
              <div class="row">
                <button type="button" data-act="openFolder">打开文件夹</button>
                <button type="button" data-act="openFile">打开文件</button>
                <button type="button" data-act="sample">打开示例</button>
              </div>
            </div>
          </div>
          <div id="compare" class="hidden"></div>
          <div id="csvPanel" class="hidden">
            <div class="csv-bar">
              <span>CSV 分析</span>
              <span id="csvSummary" class="csv-summary"></span>
              <span class="sp"></span>
              <label>图
                <select id="csvChartType">
                  <option value="bar">柱状图</option>
                  <option value="barStack">堆叠柱图</option>
                  <option value="barH">条形图</option>
                  <option value="line">折线图</option>
                  <option value="area">面积图</option>
                  <option value="pie">饼图</option>
                  <option value="doughnut">环形图</option>
                  <option value="scatter">散点图</option>
                  <option value="radar">雷达图</option>
                  <option value="heatmap">热力图</option>
                </select>
              </label>
              <button type="button" id="csvRefresh">刷新</button>
              <button type="button" id="csvClose">关闭</button>
            </div>
            <div class="csv-query">
              <div class="csv-qrow">
                <span class="csv-qlabel" title="类似 SQL GROUP BY">维度</span>
                <div id="csvDims" class="csv-chips"></div>
                <button type="button" class="csv-add" data-csv-add="dim" title="添加维度">＋</button>
              </div>
              <div class="csv-qrow">
                <span class="csv-qlabel" title="汇聚函数">指标</span>
                <div id="csvMetrics" class="csv-chips"></div>
                <button type="button" class="csv-add" data-csv-add="metric" title="添加指标">＋</button>
              </div>
              <div class="csv-qrow">
                <span class="csv-qlabel" title="类似 SQL WHERE">过滤</span>
                <div id="csvFilters" class="csv-chips"></div>
                <button type="button" class="csv-add" data-csv-add="filter" title="添加过滤">＋</button>
              </div>
            </div>
            <div class="csv-body">
              <div class="csv-table-wrap"><table id="csvTable"></table></div>
              <div id="csvResizer" title="拖动调整宽度"></div>
              <div id="csvChart"></div>
            </div>
          </div>
          <div id="mdResizer" class="hidden" title="拖动调整宽度"></div>
          <div id="mdPreview" class="hidden">
            <div class="md-bar">
              <span>Markdown 预览</span>
              <span class="sp"></span>
              <button type="button" data-mdview="split">并排</button>
              <button type="button" data-mdview="preview">仅预览</button>
              <button type="button" data-mdview="off">源码</button>
            </div>
            <div id="mdBody"></div>
          </div>
        </div>
        <div id="panelResizer" class="hidden"></div>
        <div id="panel" class="hidden">
          <div class="panel-h"><span id="panelTitle">结果</span><span class="sp"></span><button type="button" id="panelClose">关闭</button></div>
          <div id="panelBody"></div>
        </div>
      </section>
    </div>
    <footer id="status"></footer>
  </div>
  <div id="findDlg" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="popup" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <input type="file" id="fileOpen" multiple hidden>
  <input type="file" id="dirOpen" webkitdirectory directory multiple hidden>
  <input type="file" id="dirOpenB" webkitdirectory directory multiple hidden>
  <script src="js/gbk.js"></script>
  <script src="js/codec.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/model.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/neutralino.js"></script>
  <script src="js/native.js"></script>
  <script src="js/remote-config.js"></script>
  <script src="js/track.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
